name: Build cloud singing candidate
on:
  push:
    branches: [cloud-singing-20261103]
    paths: [cloud-singing/**, .github/workflows/cloud-singing-build.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: cloud-singing
          push: true
          provenance: false
          sbom: false
          outputs: type=image,oci-mediatypes=false
          tags: ${{ secrets.ACR_REGISTRY }}/breeze-tts/breeze-tts2-api:singing-20261103-v1
